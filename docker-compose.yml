services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://query_court:query_court@db:5432/query_court
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: query_court
      POSTGRES_USER: query_court
      POSTGRES_PASSWORD: query_court
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U query_court -d query_court"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
